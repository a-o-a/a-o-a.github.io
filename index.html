<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A simple animated landing page for a-o-a with a sunset sky, drifting clouds, and layered waves."
  >
  <title>a-o-a</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --page-bg: #1a1a1a;
      --text-primary: #ffffff;
      --text-muted: #a8a8a8;

      --sun-core: #fff8dc;
      --sun-mid: #ffd700;
      --sun-edge: #ffa500;

      --sun-glow-inner: rgba(255, 180, 80, 0.25);
      --sun-glow-outer: rgba(255, 140, 60, 0.1);
      --sun-glow-inner-strong: rgba(255, 180, 80, 0.45);
      --sun-glow-outer-strong: rgba(255, 120, 50, 0.2);

      --sunset-orange: rgba(255, 100, 30, 0.4);
      --sunset-pink: rgba(255, 60, 80, 0.2);
      --sunset-purple: rgba(180, 50, 120, 0.12);
      --sunset-core: rgba(255, 200, 100, 0.15);

      --cloud-fill: rgba(255, 255, 255, 0.07);
      --cloud-lobe-fill: rgba(255, 255, 255, 0.06);

      --wave-1: rgba(124, 184, 232, 0.34);
      --wave-2: rgba(84, 146, 200, 0.28);
      --wave-3: rgba(50, 102, 148, 0.2);

      --cloud-duration-1: 45s;
      --cloud-duration-2: 60s;
      --cloud-duration-3: 55s;
      --sun-cycle: 6s;
      --wave-duration-1: 4s;
      --wave-duration-2: 6s;
      --wave-duration-3: 8s;
      --text-shimmer-duration: 4s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      display: grid;
      place-items: center;
      background: var(--page-bg);
      font-family: "Space Grotesk", sans-serif;
      backface-visibility: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .scene__decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sunset {
      position: absolute;
      top: -20%;
      left: 60%;
      transform: translate3d(-50%, 0, 0);
      width: 120%;
      height: 60%;
      background: radial-gradient(
        ellipse at 50% 0%,
        var(--sunset-orange) 0%,
        var(--sunset-pink) 25%,
        var(--sunset-purple) 45%,
        transparent 75%
      );
      animation: sunset-pulse var(--sun-cycle) ease-in-out infinite;
      will-change: transform, opacity;
    }

    .sunset::after {
      content: "";
      position: absolute;
      top: 0;
      left: 60%;
      transform: translate3d(-50%, 0, 0);
      width: 40%;
      height: 100%;
      background: radial-gradient(
        ellipse at 50% 0%,
        var(--sunset-core) 0%,
        transparent 60%
      );
      animation: sun-core-pulse var(--sun-cycle) ease-in-out infinite;
    }

    .cloud {
      position: absolute;
      width: 260px;
      height: 50px;
      border-radius: 100px;
      background: var(--cloud-fill);
      filter: blur(8px);
      will-change: transform;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--cloud-lobe-fill);
      filter: blur(6px);
    }

    .cloud::before {
      width: 80px;
      height: 60px;
      top: -25px;
      left: 35px;
    }

    .cloud::after {
      width: 60px;
      height: 40px;
      top: -16px;
      right: 35px;
    }

    .cloud-1 {
      top: 12%;
      animation: cloud-drift-1 var(--cloud-duration-1) linear infinite;
    }

    .cloud-2 {
      top: 8%;
      width: 200px;
      opacity: 0.7;
      animation: cloud-drift-2 var(--cloud-duration-2) linear infinite;
    }

    .cloud-3 {
      top: 18%;
      width: 180px;
      height: 35px;
      opacity: 0.5;
      animation: cloud-drift-3 var(--cloud-duration-3) linear infinite;
    }

    .sun {
      position: absolute;
      top: 5%;
      left: 60%;
      transform: translate3d(-50%, 0, 0);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        var(--sun-core) 0%,
        var(--sun-mid) 60%,
        var(--sun-edge) 100%
      );
      box-shadow:
        0 0 20px 8px var(--sun-glow-inner),
        0 0 50px 15px var(--sun-glow-outer);
      animation: sun-glow var(--sun-cycle) ease-in-out infinite;
      will-change: box-shadow, opacity;
    }

    .scene__content {
      position: relative;
      z-index: 1;
      padding: 2rem;
    }

    .title {
      font-size: clamp(1.2rem, 5.8vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      text-shadow:
        0 10px 20px rgba(0, 0, 0, 0.3),
        0 0 24px rgba(255, 255, 255, 0.08);
      background: linear-gradient(
        135deg,
        var(--text-primary) 0%,
        var(--text-muted) 50%,
        var(--text-primary) 100%
      );
      background-size: 200% 200%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer var(--text-shimmer-duration) ease-in-out infinite;
    }

    .waves {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 29vh;
      overflow: hidden;
    }

    .waves svg {
      position: absolute;
      bottom: -1px;
      width: 200%;
      height: 100%;
      will-change: transform;
    }

    .wave-1 {
      animation: wave-move-1 var(--wave-duration-1) ease-in-out infinite;
      z-index: 3;
    }

    .wave-2 {
      animation: wave-move-2 var(--wave-duration-2) ease-in-out infinite;
      z-index: 2;
    }

    .wave-3 {
      animation: wave-move-3 var(--wave-duration-3) ease-in-out infinite;
      z-index: 1;
    }

    @keyframes sunset-pulse {
      0%,
      100% {
        opacity: 0.8;
        transform: translate3d(-50%, 0, 0) scale(1);
      }

      50% {
        opacity: 1;
        transform: translate3d(-50%, 0, 0) scale(1.05);
      }
    }

    @keyframes sun-core-pulse {
      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes cloud-drift-1 {
      0% {
        transform: translate3d(-260px, 0, 0);
      }

      100% {
        transform: translate3d(100vw, 0, 0);
      }
    }

    @keyframes cloud-drift-2 {
      0% {
        transform: translate3d(-200px, 0, 0);
      }

      100% {
        transform: translate3d(100vw, 0, 0);
      }
    }

    @keyframes cloud-drift-3 {
      0% {
        transform: translate3d(-180px, 0, 0);
      }

      100% {
        transform: translate3d(100vw, 0, 0);
      }
    }

    @keyframes sun-glow {
      0%,
      100% {
        box-shadow:
          0 0 40px 15px rgba(255, 180, 80, 0.35),
          0 0 80px 30px rgba(255, 120, 50, 0.15);
        opacity: 0.9;
      }

      50% {
        box-shadow:
          0 0 50px 20px var(--sun-glow-inner-strong),
          0 0 100px 40px var(--sun-glow-outer-strong);
        opacity: 1;
      }
    }

    @keyframes wave-move-1 {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(-15%, 0, 0);
      }
    }

    @keyframes wave-move-2 {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(-25%, 0, 0);
      }
    }

    @keyframes wave-move-3 {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(-10%, 0, 0);
      }
    }

    @keyframes shimmer {
      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Animated a-o-a landing page">
    <div class="scene__decor" aria-hidden="true">
      <div class="sunset"></div>

      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>

      <div class="sun"></div>

      <div class="waves">
        <svg class="wave-1" viewBox="0 0 1440 320" preserveAspectRatio="none">
          <path fill="var(--wave-1)" d="M0,160L60,150C120,139,240,117,360,117C480,117,600,139,720,160C840,181,960,203,1080,192C1200,181,1320,139,1380,117L1440,96L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
        </svg>
        <svg class="wave-2" viewBox="0 0 1440 320" preserveAspectRatio="none">
          <path fill="var(--wave-2)" d="M0,224L80,213C160,203,320,181,480,187C640,192,800,224,960,219C1120,213,1280,171,1360,149L1440,128L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
        </svg>
        <svg class="wave-3" viewBox="0 0 1440 320" preserveAspectRatio="none">
          <path fill="var(--wave-3)" d="M0,256L48,251C96,245,192,235,288,213C384,192,480,160,576,171C672,181,768,235,864,245C960,256,1056,224,1152,203C1248,181,1344,171,1392,165L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
      </div>
    </div>

    <section class="scene__content" aria-labelledby="page-title">
      <h1 class="title" id="page-title">hello! a-o-a</h1>
    </section>
  </main>

  <script>
    const cloudDurations = [45, 60, 55];

    document.querySelectorAll(".cloud").forEach((cloud, index) => {
      const delay = -(Math.random() * cloudDurations[index]);
      cloud.style.animationDelay = `${delay}s`;
    });
  </script>
</body>
</html>
