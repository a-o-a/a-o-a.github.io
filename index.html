<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a-o-a</title>

  <!-- Google Fonts: Space Grotesk (모던 지오메트릭 산세리프 서체) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    /* =============================================
       1. 기본 리셋 및 전역 스타일
       ============================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /*
     * body — 화면 중앙 정렬 + 다크 그레이 배경
     * position: relative — 자식 절대 위치 요소들의 기준점
     * overflow: hidden — 애니메이션이 화면 밖으로 벗어나도 스크롤 방지
     */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* =============================================
       2. 상단 노을 (Sunset Glow)
       ============================================= */

    /*
     * .sunset — 화면 상단에 퍼지는 붉은-주황-보라 그라데이션
     * radial-gradient로 중심(타원)에서 바깥으로 색이 자연스럽게 퍼짐
     * sunsetPulse 애니메이션으로 투명도와 크기가 천천히 일렁임
     */
    .sunset {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 60%;
      background: radial-gradient(
        ellipse at 50% 0%,
        rgba(255, 100, 30, 0.4) 0%,       /* 중심: 진한 오렌지 */
        rgba(255, 60, 80, 0.2) 25%,       /* 중간: 레드-핑크 */
        rgba(180, 50, 120, 0.12) 45%,     /* 외곽: 퍼플 */
        transparent 75%                    /* 끝: 투명 */
      );
      animation: sunsetPulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    /*
     * .sunset::after — 노을 중심의 따뜻한 골든 코어
     * 실제 해 주변의 빛 번짐(halo) 효과를 담당
     */
    .sunset::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 100%;
      background: radial-gradient(
        ellipse at 50% 0%,
        rgba(255, 200, 100, 0.15) 0%,
        transparent 60%
      );
      animation: sunCore 6s ease-in-out infinite;
    }

    /* 노을 일렁임 — 투명도 0.8~1, 크기 1~1.05배 */
    @keyframes sunsetPulse {
      0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }

    /* 골든 코어 점멸 — 투명도 0.6~1 */
    @keyframes sunCore {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* =============================================
       3. 구름 (Clouds)
       ============================================= */

    /*
     * .cloud — 흐릿하고 부드러운 구름 본체
     * border-radius로 타원형 캡슐 모양 + filter: blur로 퍼짐 효과
     * ::before, ::after로 구름 윗부분에 봉우리(볼록한 덩어리) 추가
     */
    .cloud {
      position: absolute;
      width: 260px;
      height: 50px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.07);
      filter: blur(8px);
      pointer-events: none;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      filter: blur(6px);
    }

    /* 구름 왼쪽 봉우리 */
    .cloud::before {
      width: 80px;
      height: 60px;
      top: -25px;
      left: 35px;
    }

    /* 구름 오른쪽 봉우리 */
    .cloud::after {
      width: 60px;
      height: 40px;
      top: -16px;
      right: 35px;
    }

    /* 구름 1 — 가장 큼, 속도 45초 */
    .cloud-1 {
      top: 12%;
      animation: cloudDrift1 45s linear infinite;
    }

    /* 구름 2 — 중간 크기, 속도 60초, 약간 투명 */
    .cloud-2 {
      top: 8%;
      width: 200px;
      animation: cloudDrift2 60s linear infinite;
      opacity: 0.7;
    }

    /* 구름 3 — 가장 작음, 속도 55초, 더 투명 */
    .cloud-3 {
      top: 18%;
      width: 180px;
      height: 35px;
      animation: cloudDrift3 55s linear infinite;
      opacity: 0.5;
    }

    /*
     * 구름 떠다니기 애니메이션
     * 화면 왼쪽 밖(-구름너비)에서 시작해 오른쪽 끝(100vw)까지 이동
     * 각 구름마다 시작 너비가 달라 키프레임 값도 개별 설정
     */
    @keyframes cloudDrift1 {
      0% { left: -260px; }
      100% { left: 100vw; }
    }
    @keyframes cloudDrift2 {
      0% { left: -200px; }
      100% { left: 100vw; }
    }
    @keyframes cloudDrift3 {
      0% { left: -180px; }
      100% { left: 100vw; }
    }

    /* =============================================
       4. 해 (Sun)
       ============================================= */

    /*
     * .sun — 화면 상단 중앙의 작은 해
     * 가운데는 밝은 라이트 골드, 가장자리는 따뜻한 오렌지로 퍼지는 그라데이션
     * box-shadow로 주변 빛 번짐(글로우) 효과
     * sunGlow 애니메이션으로 글로우가 천천히 강해졌다 약해짐
     */
    .sun {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translate(-50%, 0);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #fff8dc 0%,     /* 중심: 크림색 */
        #ffd700 60%,    /* 중간: 골드 */
        #ffa500 100%    /* 가장자리: 오렌지 */
      );
      box-shadow:
        0 0 20px 8px rgba(255, 180, 80, 0.25),    /* 안쪽 글로우 */
        0 0 50px 15px rgba(255, 140, 60, 0.1);    /* 바깥 글로우 */
      animation: sunGlow 6s ease-in-out infinite;
      pointer-events: none;
    }

    /* 해 글로우 애니메이션 — 그림자 크기와 투명도 변화 */
    @keyframes sunGlow {
      0%, 100% {
        box-shadow: 0 0 40px 15px rgba(255, 180, 80, 0.35), 0 0 80px 30px rgba(255, 120, 50, 0.15);
        opacity: 0.9;
      }
      50% {
        box-shadow: 0 0 50px 20px rgba(255, 180, 80, 0.45), 0 0 100px 40px rgba(255, 120, 50, 0.2);
        opacity: 1;
      }
    }

    /* =============================================
       5. 하단 파도 (Waves — SVG)
       ============================================= */

    /*
     * .wave-container — 화면 하단 20%를 차지하는 파도 영역
     * 각 SVG는 파도 모양의 경로(path)를 그리며,
     * 서로 다른 색상·투명도·속도로 좌우 이동해 일렁이는 바다 효과
     */
    .wave-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 20%;
      pointer-events: none;
    }

    .wave-container svg {
      position: absolute;
      bottom: 0;
      width: 200%;   /* 좌우 이동을 위해 화면의 2배 너비 */
      height: 100%;
    }

    .wave-svg-1 {
      animation: waveMove1 4s ease-in-out infinite;
    }
    .wave-svg-2 {
      animation: waveMove2 6s ease-in-out infinite;
    }
    .wave-svg-3 {
      animation: waveMove3 8s ease-in-out infinite;
    }

    /*
     * 파도 흔들림 — 좌우로平移 이동
     * 레이어마다 이동 거리와 주기를 다르게 해서 자연스러운 중첩 효과
     */
    @keyframes waveMove1 {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-15%); }
    }
    @keyframes waveMove2 {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-25%); }
    }
    @keyframes waveMove3 {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-10%); }
    }

    /* =============================================
       6. 중앙 텍스트
       ============================================= */

    /*
     * .text — 화면 중앙의 "hello! a-o-a"
     * white→gray→white 그라데이션을 text에 적용 (background-clip: text)
     * shimmer — 그라데이션이 좌우로 흘러가며 빛 반사 효과
     */
    .text {
      position: relative;
      z-index: 1;
      font-size: clamp(2rem, 6vw, 5rem);  /* 반응형: 최소 2rem ~ 최대 5rem */
      font-weight: 700;
      letter-spacing: 0.15em;              /* 자간 넓게 */
      background: linear-gradient(
        135deg,
        #ffffff 0%,
        #a8a8a8 50%,
        #ffffff 100%
      );
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s ease-in-out infinite;
      text-transform: lowercase;
    }

    /* 그라데이션 좌우 이동 — 빛이 반사되어 지나가는 효과 */
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
  </style>
</head>
<body>

  <!-- 상단 노을 배경 (붉은-주황-보라 그라데이션) -->
  <div class="sunset"></div>

  <!-- 떠다니는 구름 3개 (각각 다른 높이·크기·속도) -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <!-- 상단 중앙 해 (골드 그라데이션 원 + 글로우) -->
  <div class="sun"></div>

  <!-- 화면 중앙 텍스트 -->
  <p class="text">hello! a-o-a</p>

  <!-- 하단 SVG 파도 3중 레이어 -->
  <div class="wave-container">
    <!-- 파도 1 — 가장 진한 층, 가장 빠름 (4초) -->
    <svg class="wave-svg-1" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="rgba(100,160,220,0.25)" d="M0,160L60,150C120,139,240,117,360,117C480,117,600,139,720,160C840,181,960,203,1080,192C1200,181,1320,139,1380,117L1440,96L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
    </svg>
    <!-- 파도 2 — 중간층, 중간 속도 (6초) -->
    <svg class="wave-svg-2" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="rgba(80,140,190,0.2)" d="M0,224L80,213C160,203,320,181,480,187C640,192,800,224,960,219C1120,213,1280,171,1360,149L1440,128L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
    </svg>
    <!-- 파도 3 — 가장 옅은 층, 가장 느림 (8초) -->
    <svg class="wave-svg-3" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="rgba(60,120,160,0.15)" d="M0,256L48,251C96,245,192,235,288,213C384,192,480,160,576,171C672,181,768,235,864,245C960,256,1056,224,1152,203C1248,181,1344,171,1392,165L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>

  <!--
    구름 초기 위치 랜덤화
    페이지 로드 시 각 구름의 animationDelay에 -N초(음수)를 설정해
    애니메이션이 이미 N초 진행된 상태에서 시작되도록 함
    → 매번 새로고침할 때마다 구름이 화면 여기저기 다른 위치에 나타남
  -->
  <script>
    document.querySelectorAll('.cloud').forEach((el, i) => {
      const durations = [45, 60, 55]; // 각 구름의 전체 애니메이션 시간(초)
      const delay = -(Math.random() * durations[i]); // 음수 딜레이
      el.style.animationDelay = delay + 's';
    });
  </script>
</body>
</html>
